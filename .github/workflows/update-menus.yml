name: Update menus

on:
  schedule:
    - cron: "17 3 * * *"     # every day ~05:17 Berlin time
    - cron: "23 15 * * 5,6,0" # Fri–Sun afternoon, to catch next week's menu early
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch menus from stw.berlin
        run: python scripts/scrape.py docs/data/menus.json
      - name: Commit if changed
        run: |
          git config user.name "menu-bot"
          git config user.email "menu-bot@users.noreply.github.com"
          git add docs/data/menus.json
          git diff --cached --quiet || git commit -m "Update menus $(date -u +%F)"
          git push
